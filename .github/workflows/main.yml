#!/bin/bash
# =================================================================
# UNATTENDED PTERODACTYL SETUP v3.0 (Panel + Wings + SSL)
# Target: Ubuntu 22.04 / 24.04 VPS
# Jalankan sebagai root:  SETUP_DB_PASS='passwordku' bash setup.sh
# =================================================================

export DEBIAN_FRONTEND=noninteractive

PANEL_DOMAIN="panel.paridx.my.id"
WINGS_DOMAIN="wings.paridx.my.id"
EMAIL="saintparid@gmail.com"
DB_PASS="${SETUP_DB_PASS:?SETUP_DB_PASS belum di-set. Jalankan: SETUP_DB_PASS='password' bash setup.sh}"

echo -e "\e[36m[+] Memulai instalasi Pterodactyl Suite...\e[0m"

# 0. Prasyarat dasar
apt update -y
apt upgrade -y
apt install -y software-properties-common curl apt-transport-https ca-certificates gnupg tar unzip redis-server mariadb-server nginx certbot python3-certbot-nginx git

# 1. Install Docker (wajib untuk Wings)
if ! command -v docker &>/dev/null; then
    curl -fsSL https://get.docker.com | sh
fi
systemctl enable --now docker
docker network create pterodactyl_nw 2>/dev/null || true

# 2. PHP 8.2
LC_ALL=C.UTF-8 add-apt-repository -y ppa:ondrej/php
apt update -y
apt install -y php8.2 php8.2-{common,cli,gd,mysql,mbstring,bcmath,xml,fpm,curl,zip}
update-alternatives --set php /usr/bin/php8.2 2>/dev/null || true

# 3. MariaDB
systemctl enable --now mariadb
mysql -u root -e "CREATE USER IF NOT EXISTS 'pterodactyl'@'127.0.0.1' IDENTIFIED BY '${DB_PASS}';"
mysql -u root -e "CREATE DATABASE IF NOT EXISTS panel;"
mysql -u root -e "GRANT ALL PRIVILEGES ON panel.* TO 'pterodactyl'@'127.0.0.1' WITH GRANT OPTION;"
mysql -u root -e "FLUSH PRIVILEGES;"

# 4. Panel files
mkdir -p /var/www/pterodactyl
cd /var/www/pterodactyl
curl -Lo panel.tar.gz https://github.com/pterodactyl/panel/releases/latest/download/panel.tar.gz
tar -xzvf panel.tar.gz
chmod -R 755 storage/* bootstrap/cache/

# 5. Composer + dependensi
curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
cp .env.example .env
composer install --no-dev --optimize-autoloader

# 6. Konfigurasi panel
php artisan key:generate --force
php artisan p:environment:setup \
    --author="${EMAIL}" \
    --url="https://${PANEL_DOMAIN}" \
    --timezone="Asia/Jakarta" \
    --cache="redis" \
    --session="database" \
    --queue="redis" \
    --telemetry=false

php artisan p:environment:database \
    --host="127.0.0.1" \
    --port="3306" \
    --database="panel" \
    --username="pterodactyl" \
    --password="${DB_PASS}"

php artisan migrate --seed --force

php artisan p:user:make \
    --email="${EMAIL}" \
    --username="parid" \
    --name-first="Farid" \
    --name-last="A." \
    --password="paridos" \
    --admin=1

chown -R www-data:www-data /var/www/pterodactyl/*

# 7. Nginx (HTTP dulu, nanti certbot yang pasang SSL otomatis)
cat <<EOF > /etc/nginx/sites-available/pterodactyl.conf
server {
    listen 80;
    server_name ${PANEL_DOMAIN};
    root /var/www/pterodactyl/public;
    index index.php;
    client_max_body_size 100m;
    client_body_timeout 120s;
    sendfile off;

    location / {
        try_files \$uri \$uri/ /index.php?\$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)\$;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }
}
EOF
ln -sf /etc/nginx/sites-available/pterodactyl.conf /etc/nginx/sites-enabled/pterodactyl.conf
rm -f /etc/nginx/sites-enabled/default
nginx -t && systemctl restart nginx

# 8. SSL otomatis (Let's Encrypt) — butuh DNS sudah mengarah ke VPS ini
certbot --nginx -d "${PANEL_DOMAIN}" --non-interactive --agree-tos -m "${EMAIL}" --redirect

# 9. Cron & queue worker
( crontab -l 2>/dev/null; echo "* * * * * php /var/www/pterodactyl/artisan schedule:run >> /dev/null 2>&1" ) | crontab -
cat <<EOF > /etc/systemd/system/pteroq.service
[Unit]
Description=Pterodactyl Queue Worker
After=redis-server.service
[Service]
User=www-data
Group=www-data
Restart=always
ExecStart=/usr/bin/php /var/www/pterodactyl/artisan queue:work --queue=high,standard,low --sleep=3 --tries=3
[Install]
WantedBy=multi-user.target
EOF
systemctl enable --now pteroq.service

# 10. Wings
mkdir -p /etc/pterodactyl /var/run/wings
curl -L -o /usr/local/bin/wings "https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_$([[ "$(uname -m)" == "x86_64" ]] && echo "amd64" || echo "arm64")"
chmod u+x /usr/local/bin/wings

cat <<EOF > /etc/systemd/system/wings.service
[Unit]
Description=Pterodactyl Wings Daemon
After=docker.service
Requires=docker.service
PartOf=docker.service
[Service]
User=root
WorkingDirectory=/etc/pterodactyl
LimitNOFILE=4096
PIDFile=/var/run/wings/daemon.pid
ExecStart=/usr/local/bin/wings
Restart=on-failure
StartLimitInterval=180
StartLimitBurst=30
RestartSec=5s
[Install]
WantedBy=multi-user.target
EOF
systemctl enable wings

# 11. Certificate SSL untuk Wings + config dasar
systemctl restart wings
certbot certonly --nginx -d "${WINGS_DOMAIN}" --non-interactive --agree-tos -m "${EMAIL}"

# Salin cert untuk Wings (path ini yang dipakai di config.yml panel nanti)
mkdir -p /etc/letsencrypt/live/"${WINGS_DOMAIN}"
systemctl restart nginx

echo -e "\e[32m[V] PTERODACTYL SUITE SELESAI!\e[0m"
echo -e "\e[33mPanel : https://${PANEL_DOMAIN}\e[0m"
echo -e "\e[33mLogin : ${EMAIL} | Pass: paridos\e[0m"
echo -e "\e[33mJangan lupa: login panel -> Admin -> Nodes -> tambah node, lalu isi /etc/pterodactyl/config.yml di VPS dan 'systemctl restart wings'\e[0m"
