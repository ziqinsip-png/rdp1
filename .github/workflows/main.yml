#!/bin/bash
# =================================================================
# PTERODACTYL AUTO SETUP v4.0
# Untuk: Ubuntu 22.04 / 24.04 (fresh VPS)
# Jalankan: SETUP_DB_PASS='passwordku' bash setup.sh
# =================================================================

export DEBIAN_FRONTEND=noninteractive

PANEL_DOMAIN="panel.paridx.my.id"
WINGS_DOMAIN="wings.paridx.my.id"
EMAIL="saintparid@gmail.com"
ADMIN_EMAIL="saintparid@gmail.com"
ADMIN_USER="parid"
ADMIN_PASS="paridos"
DB_PASS="${SETUP_DB_PASS:?Error: jalankan dengan SETUP_DB_PASS='password' bash setup.sh}"

set -e  # berhenti jika ada error

echo -e "\e[36m[1/9] Update sistem & install dependensi...\e[0m"
apt update -y
apt upgrade -y
apt install -y software-properties-common curl apt-transport-https \
    ca-certificates gnupg tar unzip redis-server mariadb-server nginx \
    certbot python3-certbot-nginx git fail2ban

systemctl enable --now fail2ban

echo -e "\e[36m[2/9] Install Docker...\e[0m"
if ! command -v docker &>/dev/null; then
    curl -fsSL https://get.docker.com | sh
fi
systemctl enable --now docker
docker network create pterodactyl_nw 2>/dev/null || true

echo -e "\e[36m[3/9] Install PHP 8.2...\e[0m"
LC_ALL=C.UTF-8 add-apt-repository -y ppa:ondrej/php
apt update -y
apt install -y php8.2 php8.2-{common,cli,gd,mysql,mbstring,bcmath,xml,fpm,curl,zip}

echo -e "\e[36m[4/9] Setup database MariaDB...\e[0m"
systemctl enable --now mariadb
mysql -u root <<SQL
CREATE USER IF NOT EXISTS 'pterodactyl'@'127.0.0.1' IDENTIFIED BY '${DB_PASS}';
CREATE DATABASE IF NOT EXISTS panel;
GRANT ALL PRIVILEGES ON panel.* TO 'pterodactyl'@'127.0.0.1' WITH GRANT OPTION;
FLUSH PRIVILEGES;
SQL

echo -e "\e[36m[5/9] Download & install panel Pterodactyl...\e[0m"
mkdir -p /var/www/pterodactyl
cd /var/www/pterodactyl
curl -Lo panel.tar.gz https://github.com/pterodactyl/panel/releases/latest/download/panel.tar.gz
tar -xzvf panel.tar.gz
chmod -R 755 storage/* bootstrap/cache/

curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
cp .env.example .env
composer install --no-dev --optimize-autoloader

echo -e "\e[36m[6/9] Konfigurasi panel & buat akun admin...\e[0m"
php artisan key:generate --force
php artisan p:environment:setup \
    --author="${EMAIL}" \
    --url="https://${PANEL_DOMAIN}" \
    --timezone="Asia/Jakarta" \
    --cache="redis" \
    --session="database" \
    --queue="redis" \
    --telemetry=false

php
