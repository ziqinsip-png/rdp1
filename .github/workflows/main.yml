name: RDP-FullSetup-withScript

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' 

concurrency:
  group: tailscale-exit-node
  cancel-in-progress: true

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: pwsh
        run: |
          $password = -join ((33..126) | Get-Random -Count 20 | ForEach-Object {[char]$_})
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          "RDP_USER=RDP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASS=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Desktop Setup Script
        shell: pwsh
        run: |
          $ps1 = "C:\Users\Public\Desktop\Setup.ps1"
          $bat = "C:\Users\Public\Desktop\Setup-Workspace.bat"

          $lines = @()
          $lines += 'Write-Host "1. Mengaktifkan Dark Mode..." -ForegroundColor Cyan'
          $lines += 'Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "AppsUseLightTheme" -Value 0'
          $lines += 'Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "SystemUsesLightTheme" -Value 0'
          $lines += ''
          $lines += 'Write-Host "2. Mengunduh dan memasang Wallpaper 4K..." -ForegroundColor Cyan'
          $lines += '$url = "https://4kwallpapers.com/images/wallpapers/windows-11-dark-mode-abstract-background-black-background-7680x4320-8710.png"'
          $lines += '$img = "$env:TEMP\wallpaper.png"'
          $lines += 'Invoke-WebRequest -Uri $url -OutFile $img'
          $lines += ''
          $lines += 'Add-Type -TypeDefinition @"'
          $lines += 'using System;'
          $lines += 'using System.Runtime.InteropServices;'
          $lines += 'public class WP {'
          $lines += '    [DllImport("user32.dll", CharSet=CharSet.Auto)]'
          $lines += '    public static extern int SystemParametersInfo(int uA, int uP, string lpv, int fu);'
          $lines += '    public static void Set(string p) {'
          $lines += '        SystemParametersInfo(20, 0, p, 3);'
          $lines += '    }'
          $lines += '}'
          $lines += '"@'
          $lines += '[WP]::Set($img)'
          $lines += ''
          $lines += 'Write-Host "3. Menginstal Brave Browser & VS Code..." -ForegroundColor Cyan'
          $lines += 'choco install brave vscode -y'
          $lines += ''
          $lines += 'Write-Host "4. Menginstal Ubuntu 22.04 LTS (Background)..." -ForegroundColor Cyan'
          $lines += 'wsl --install -d Ubuntu-22.04 --no-launch'
          $lines += 'Start-Sleep -Seconds 15'
          $lines += ''
          $lines += 'Write-Host "5. Konfigurasi WSL (User RDP, Password root) & Instalasi Paket..." -ForegroundColor Cyan'
          $lines += 'wsl -d Ubuntu-22.04 -u root bash -c "useradd -m -s /bin/bash RDP"'
          $lines += 'wsl -d Ubuntu-22.04 -u root bash -c "echo ''RDP:root'' | chpasswd"'
          $lines += 'wsl -d Ubuntu-22.04 -u root bash -c "usermod -aG sudo RDP"'
          $lines += 'wsl -d Ubuntu-22.04 -u root bash -c "echo -e ''[user]\ndefault=RDP'' > /etc/wsl.conf"'
          $lines += 'wsl -t Ubuntu-22.04'
          $lines += 'Start-Sleep -Seconds 5'
          $lines += 'wsl -d Ubuntu-22.04 -u root bash -c "apt update -y && DEBIAN_FRONTEND=noninteractive apt upgrade -y && DEBIAN_FRONTEND=noninteractive apt install neofetch nmap -y"'
          $lines += ''
          $lines += 'Write-Host "`n=============================================" -ForegroundColor Green'
          $lines += 'Write-Host "Semua setup berhasil! Silakan nikmati Desktop-mu." -ForegroundColor Green'
          $lines += 'Write-Host "=============================================" -ForegroundColor Green'
          $lines += 'pause'

          $ps1Code = $lines -join "`r`n"
          Set-Content -Path $ps1 -Value $ps1Code -Encoding UTF8

          $batLines = @()
          $batLines += '@echo off'
          $batLines += '>nul 2>&1 "%SYSTEMROOT%\system32\cacls.exe" "%SYSTEMROOT%\system32\config\system"'
          $batLines += "if '%errorlevel%' NEQ '0' ("
          $batLines += '    echo Meminta hak akses Administrator untuk setup...'
          $batLines += '    echo Set UAC = CreateObject^("Shell.Application"^) > "%temp%\getadmin.vbs"'
          $batLines += '    echo UAC.ShellExecute "%~s0", "", "", "runas", 1 >> "%temp%\getadmin.vbs"'
          $batLines += '    "%temp%\getadmin.vbs"'
          $batLines += '    exit /B'
          $batLines += ')'
          $batLines += 'if exist "%temp%\getadmin.vbs" ( del "%temp%\getadmin.vbs" )'
          $batLines += 'powershell.exe -ExecutionPolicy Bypass -WindowStyle Normal -File "C:\Users\Public\Desktop\Setup.ps1"'

          $batCode = $batLines -join "`r`n"
          Set-Content -Path $bat -Value $batCode -Encoding ASCII

      - name: Install and Connect Tailscale
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "IPEnableRouter" -Value 1

          Write-Host "Mengunduh Tailscale..."
          Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi -OutFile ts.msi

          $installProcess = Start-Process msiexec.exe -ArgumentList "/i ts.msi /quiet /norestart" -Wait -PassThru -NoNewWindow
          $installProcess.WaitForExit()

          $searchPaths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe",
            "C:\Program Files\Tailscale\tailscale.exe",
            "C:\Program Files (x86)\Tailscale\tailscale.exe"
          )

          $ts = $null
          $retry = 0
          while (-not $ts -and $retry -lt 15) {
              foreach ($p in $searchPaths) { if (Test-Path $p) { $ts = $p; break } }
              if (-not $ts) { Start-Sleep -Seconds 2; $retry++ }
          }

          if (-not $ts) { throw "Tailscale binary not found after installation" }
          "TS_PATH=$ts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # HAPUS --advertise-tags biar auth key kamu bisa dipake
          & $ts up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID" --advertise-exit-node --accept-routes --unattended --reset
          Start-Sleep -Seconds 15

      - name: Show Azure Public Info
        shell: pwsh
        run: |
          Write-Host "`n=== AZURE PUBLIC INFO ==="
          $ipinfo = Invoke-RestMethod https://ipinfo.io/json
          $ipinfo | ConvertTo-Json -Depth 3

      - name: Get Tailscale IP
        shell: pwsh
        run: |
          $ts = $env:TS_PATH
          $tsIP = & $ts ip -4
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Display RDP Info
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USER"
          Write-Host "Password     : $env:RDP_PASS"
          Write-Host "=========================`n"

      - name: Keep Alive
        shell: pwsh
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Exit Node Active"
              Start-Sleep -Seconds 600
          }

      - name: Cleanup Tailscale (Graceful Exit)
        if: always()
        shell: pwsh
        run: |
          $ts = $env:TS_PATH
          if ($ts -and (Test-Path $ts)) {
              Write-Host "Membersihkan exit node dari dashboard..."
              & $ts logout
          }
